<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>蔵王温泉絶景集！｜スキー場絶景集</title>
    <meta name="description" content="山形県の蔵王温泉スキー場で撮った樹氷などの絶景写真集。">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏔</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@600;700;900&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap" rel="stylesheet">
    <!-- ?v= の数字は、CSS や JS を直したら1つ増やす（ブラウザが古いファイルを使い続けないように） -->
    <link rel="stylesheet" href="css/style.css?v=4">
</head>
<body class="page-resort">

    <header class="resort-header">
        <!-- 見出しの後ろに薄く敷く写真（青空と樹氷。bg-low で樹氷のある下のほうを見せる） -->
        <img class="resort-header-bg bg-low" src="images/zao/IMG_3879.jpg" alt="">
        <a class="back-link" href="index.html">← 日本地図にもどる</a>
        <h1 class="resort-title"><span>蔵王温泉</span><span>絶景集！</span></h1>
    </header>

    <main class="resort-main">
        <!-- 説明文 -->
        <section class="resort-intro">
            <p>蔵王温泉はやっぱり樹氷が有名すぎますよね！ただ蔵王温泉の魅力はそれだけではなく、10kmの超ロングコースや、かけ流しもある温泉宿など沢山あります！皆さんも是非一度行かれてみてはいかがでしょうか。</p>
        </section>

        <!-- 写真一覧：小さい写真（thumb）を並べて、クリックすると大きい写真を表示する
             写真を増やすときは li を1行コピーして、2か所のファイル名を書きかえる -->
        <section class="gallery-section">
            <h2 class="gallery-heading">絶景ギャラリー<span class="photo-count" id="js-photo-count"></span></h2>
            <ul class="gallery" id="js-gallery">
                <li><a class="gallery-link" href="images/zao/IMG_3879.jpg"><img src="images/zao/thumb/IMG_3879.jpg" alt="青空の下に並ぶ樹氷" loading="lazy"></a></li>
                <li><a class="gallery-link" href="images/zao/IMG_3880.jpg"><img src="images/zao/thumb/IMG_3880.jpg" alt="樹氷の間のゲレンデを滑る人たち" loading="lazy"></a></li>
                <li><a class="gallery-link" href="images/zao/IMG_3881.jpg"><img src="images/zao/thumb/IMG_3881.jpg" alt="飛行機の窓から見た雪の景色" loading="lazy"></a></li>
                <li><a class="gallery-link" href="images/zao/IMG_3882.jpg"><img src="images/zao/thumb/IMG_3882.jpg" alt="霧の中にたたずむ樹氷" loading="lazy"></a></li>
                <li><a class="gallery-link" href="images/zao/IMG_3883.jpg"><img src="images/zao/thumb/IMG_3883.jpg" alt="霧に包まれた樹氷原" loading="lazy"></a></li>
                <li><a class="gallery-link" href="images/zao/IMG_3884.jpg"><img src="images/zao/thumb/IMG_3884.jpg" alt="山の上から見下ろす雲と山並み" loading="lazy"></a></li>
            </ul>
        </section>

        <p class="back-bottom"><a class="back-link" href="index.html">← 日本地図にもどる</a></p>
    </main>

    <footer class="site-footer">
        <small>&copy; 2026 スキー場絶景集</small>
    </footer>

    <!-- 写真の拡大表示（ライトボックス）。ふだんは隠れていて、写真をクリックすると出てくる -->
    <div class="lightbox" id="js-lightbox" role="dialog" aria-modal="true" aria-label="写真の拡大表示">
        <button class="lightbox-btn lightbox-close" type="button" aria-label="閉じる">&times;</button>
        <button class="lightbox-btn lightbox-prev" type="button" aria-label="前の写真">&#8249;</button>
        <figure class="lightbox-figure">
            <img class="lightbox-image" alt="">
            <figcaption class="lightbox-count"></figcaption>
        </figure>
        <button class="lightbox-btn lightbox-next" type="button" aria-label="次の写真">&#8250;</button>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <script src="js/script.js?v=4"></script>
</body>
</html>
