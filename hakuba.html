<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>白馬村＆小谷村｜スキー場絶景集</title>
    <meta name="description" content="長野県の白馬村と小谷村のスキー場（白馬八方・白馬岩岳・白馬47＆五竜・栂池高原・白馬コルチナ）と、白馬村からの絶景写真。">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏔</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@600;700;900&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap" rel="stylesheet">
    <!-- ?v= の数字は、CSS や JS を直したら1つ増やす（ブラウザが古いファイルを使い続けないように） -->
    <link rel="stylesheet" href="css/style.css?v=6">
</head>
<body class="page-resort">

    <header class="resort-header">
        <!-- 見出しの後ろに薄く敷く写真（朝日に染まる北アルプス） -->
        <img class="resort-header-bg" src="images/hakuba/IMG_0533.jpg" alt="">
        <a class="back-link" href="index.html">← 日本地図にもどる</a>
        <h1 class="resort-title"><span>白馬村＆</span><span>小谷村</span></h1>
    </header>

    <main class="resort-main">
        <!-- 説明文（※仮の文章。自分の文章に書きかえてOK） -->
        <section class="resort-intro">
            <p>北アルプスのふもと、白馬村と小谷村には個性豊かなスキー場がずらり！地図の青い点か下のボタンから、見たいスキー場を選んでね。</p>
        </section>

        <!-- 村の地図からスキー場を選ぶ
             点の位置は data-lat（緯度）・data-lon（経度）から script.js が計算する。
             data-north / south / west / east は、地図画像の上下左右の端のだいたいの緯度・経度 -->
        <section class="area-map-section">
            <h2 class="gallery-heading">スキー場を選ぶ</h2>
            <div class="area-map js-area-map" data-north="36.925" data-south="36.600" data-west="137.745" data-east="138.045">
                <img class="area-map-image" src="images/hakuba-otari-map.png" alt="白馬村と小谷村の地図">
                <span class="area-label label-otari" aria-hidden="true">小谷村</span>
                <span class="area-label label-hakuba" aria-hidden="true">白馬村</span>

                <!-- ▼スキー場の点（クリックするとそのスキー場のページへ） -->
                <a class="spot" href="cortina.html" data-lat="36.820" data-lon="137.880">
                    <span class="spot-name">白馬コルチナ</span>
                </a>
                <a class="spot" href="tsugaike.html" data-lat="36.768" data-lon="137.857">
                    <span class="spot-name">栂池高原</span>
                </a>
                <a class="spot" href="iwatake.html" data-lat="36.722" data-lon="137.858">
                    <span class="spot-name">白馬岩岳</span>
                </a>
                <a class="spot" href="happo.html" data-lat="36.700" data-lon="137.833">
                    <span class="spot-name">白馬八方</span>
                </a>
                <a class="spot" href="goryu.html" data-lat="36.668" data-lon="137.833">
                    <span class="spot-name">白馬47＆五竜</span>
                </a>
            </div>

            <p class="area-hint">青い点にカーソルを合わせるとスキー場名が出るよ。クリックでそのスキー場の絶景集へ！</p>
            <ul class="area-list">
                <li><a href="happo.html">白馬八方</a></li>
                <li><a href="iwatake.html">白馬岩岳</a></li>
                <li><a href="goryu.html">白馬47＆五竜</a></li>
                <li><a href="tsugaike.html">栂池高原</a></li>
                <li><a href="cortina.html">白馬コルチナ</a></li>
            </ul>
        </section>

        <!-- 白馬村からの絶景（写真一覧。クリックすると大きい写真を表示する） -->
        <section class="gallery-section">
            <h2 class="gallery-heading">白馬村からの絶景<span class="photo-count" id="js-photo-count"></span></h2>
            <ul class="gallery" id="js-gallery">
                <li><a class="gallery-link" href="images/hakuba/IMG_0237.jpg"><img src="images/hakuba/thumb/IMG_0237.jpg" alt="雪の木々と白馬の町の夜景" loading="lazy"></a></li>
                <li><a class="gallery-link" href="images/hakuba/IMG_0250.jpg"><img src="images/hakuba/thumb/IMG_0250.jpg" alt="夕暮れの空と雪をかぶった木" loading="lazy"></a></li>
                <li><a class="gallery-link" href="images/hakuba/IMG_0255.jpg"><img src="images/hakuba/thumb/IMG_0255.jpg" alt="ピンク色に染まる雲と雪山" loading="lazy"></a></li>
                <li><a class="gallery-link" href="images/hakuba/IMG_0499.jpg"><img src="images/hakuba/thumb/IMG_0499.jpg" alt="夜のゲレンデと白馬の町の明かり" loading="lazy"></a></li>
                <li><a class="gallery-link" href="images/hakuba/IMG_0522.jpg"><img src="images/hakuba/thumb/IMG_0522.jpg" alt="夕焼けの空と北アルプス" loading="lazy"></a></li>
                <li><a class="gallery-link" href="images/hakuba/IMG_0527.jpg"><img src="images/hakuba/thumb/IMG_0527.jpg" alt="雪原の上に広がる星空" loading="lazy"></a></li>
                <li><a class="gallery-link" href="images/hakuba/IMG_0533.jpg"><img src="images/hakuba/thumb/IMG_0533.jpg" alt="朝日に染まる北アルプス" loading="lazy"></a></li>
                <li><a class="gallery-link" href="images/hakuba/IMG_6529.jpg"><img src="images/hakuba/thumb/IMG_6529.jpg" alt="朝焼けの北アルプスと雪の林" loading="lazy"></a></li>
                <li><a class="gallery-link" href="images/hakuba/IMG_9349.jpg"><img src="images/hakuba/thumb/IMG_9349.jpg" alt="雲の切れ間の青空と雪の村" loading="lazy"></a></li>
                <li><a class="gallery-link" href="images/hakuba/IMG_9350.jpg"><img src="images/hakuba/thumb/IMG_9350.jpg" alt="雲の広がる空と雪の村" loading="lazy"></a></li>
                <li><a class="gallery-link" href="images/hakuba/IMG_9354.jpg"><img src="images/hakuba/thumb/IMG_9354.jpg" alt="雲間から差す光と雪の田んぼ" loading="lazy"></a></li>
                <li><a class="gallery-link" href="images/hakuba/IMG_9356.jpg"><img src="images/hakuba/thumb/IMG_9356.jpg" alt="雲間の光と雪の道" loading="lazy"></a></li>
            </ul>
        </section>

        <p class="back-bottom"><a class="back-link" href="index.html">← 日本地図にもどる</a></p>
    </main>

    <footer class="site-footer">
        <small>&copy; 2026 スキー場絶景集</small>
    </footer>

    <!-- 写真の拡大表示（ライトボックス）。ふだんは隠れていて、写真をクリックすると出てくる -->
    <div class="lightbox" id="js-lightbox" role="dialog" aria-modal="true" aria-label="写真の拡大表示">
        <button class="lightbox-btn lightbox-close" type="button" aria-label="閉じる">&times;</button>
        <button class="lightbox-btn lightbox-prev" type="button" aria-label="前の写真">&#8249;</button>
        <figure class="lightbox-figure">
            <img class="lightbox-image" alt="">
            <figcaption class="lightbox-count"></figcaption>
        </figure>
        <button class="lightbox-btn lightbox-next" type="button" aria-label="次の写真">&#8250;</button>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <script src="js/script.js?v=6"></script>

    <!-- アクセス数を数える（GoatCounter）。ネットに公開したページで開いたときだけ数えられる（PC内のファイルとして開いたときは数えない） -->
    <script data-goatcounter="https://gorouzaemon.goatcounter.com/count"
            async src="https://gc.zgo.at/count.js"></script>
</body>
</html>
