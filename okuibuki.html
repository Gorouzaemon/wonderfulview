<body class="page-resort">

    <header class="resort-header">
        <!-- 見出しの後ろに薄く敷く写真（雪山を望むゲレンデ） -->
        <img class="resort-header-bg" src="images/okuibuki/IMG_3911.jpg" alt="">
        <a class="back-link" href="index.html">← 日本地図にもどる</a>
        <h1 class="resort-title"><span>奥伊吹</span><span>絶景集！</span></h1>
    </header>

    <main class="resort-main">
        <!-- 説明文 -->
        <section class="resort-intro">
            <p>グランスノー奥伊吹は関西一将来性のあるスキー場です。米原駅から直行バスが出ていたり、11月中にも人工雪で無理やりにでもオープンする他のスキー場に比べて圧倒的な熱量のあるスキー場です。</p>
        </section>

        <!-- 写真一覧：小さい写真（thumb）を並べて、クリックすると大きい写真を表示する
             写真を増やすときは li を1行コピーして、2か所のファイル名を書きかえる -->
        <section class="gallery-section">
            <h2 class="gallery-heading">絶景ギャラリー<span class="photo-count" id="js-photo-count"></span></h2>
            <ul class="gallery" id="js-gallery">
                <li><a class="gallery-link" href="images/okuibuki/IMG_3907.jpg"><img src="images/okuibuki/thumb/IMG_3907.jpg" alt="リフトが続くゲレンデ" loading="lazy"></a></li>
                <li><a class="gallery-link" href="images/okuibuki/IMG_3908.jpg"><img src="images/okuibuki/thumb/IMG_3908.jpg" alt="ゲレンデから見わたす雪山の連なり" loading="lazy"></a></li>
                <li><a class="gallery-link" href="images/okuibuki/IMG_3909.jpg"><img src="images/okuibuki/thumb/IMG_3909.jpg" alt="青空と雲の下の雪山" loading="lazy"></a></li>
                <li><a class="gallery-link" href="images/okuibuki/IMG_3910.jpg"><img src="images/okuibuki/thumb/IMG_3910.jpg" alt="リフトについて書かれた掲示" loading="lazy"></a></li>
                <li><a class="gallery-link" href="images/okuibuki/IMG_3911.jpg"><img src="images/okuibuki/thumb/IMG_3911.jpg" alt="雪山を望むゲレンデを滑るスキーヤー" loading="lazy"></a></li>
            </ul>
        </section>

        <p class="back-bottom"><a class="back-link" href="index.html">← 日本地図にもどる</a></p>
    </main>

    <footer class="site-footer">
        <small>&copy; 2026 スキー場絶景集</small>
    </footer>

    <!-- 写真の拡大表示（ライトボックス）。ふだんは隠れていて、写真をクリックすると出てくる -->
    <div class="lightbox" id="js-lightbox" role="dialog" aria-modal="true" aria-label="写真の拡大表示">
        <button class="lightbox-btn lightbox-close" type="button" aria-label="閉じる">&times;</button>
        <button class="lightbox-btn lightbox-prev" type="button" aria-label="前の写真">&#8249;</button>
        <figure class="lightbox-figure">
            <img class="lightbox-image" alt="">
            <figcaption class="lightbox-count"></figcaption>
        </figure>
        <button class="lightbox-btn lightbox-next" type="button" aria-label="次の写真">&#8250;</button>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <script src="js/script.js?v=6"></script>

    <!-- アクセス数を数える（GoatCounter）。ネットに公開したページで開いたときだけ数えられる（PC内のファイルとして開いたときは数えない） -->
    <script data-goatcounter="https://gorouzaemon.goatcounter.com/count"
            async src="https://gc.zgo.at/count.js"></script>
</body>
</html>
