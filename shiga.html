<body class="page-resort">

    <header class="resort-header">
        <!-- 見出しの後ろに薄く敷く写真（雲の下に広がる雪山） -->
        <img class="resort-header-bg" src="images/shiga/IMG_3886.jpg" alt="">
        <a class="back-link" href="index.html">← 日本地図にもどる</a>
        <h1 class="resort-title"><span>志賀高原</span><span>絶景集！</span></h1>
    </header>

    <main class="resort-main">
        <!-- 説明文 -->
        <section class="resort-intro">
            <p>志賀高原は長野県山ノ内町にある、とにかくたくさんのスキー場が集まった日本最大級のスキーエリア。最長コースは野沢温泉や蔵王温泉に匹敵する長さ！雪質もよく、長野オリンピックの会場にもなったゲレンデで、雪山の絶景をたっぷり楽しめます！</p>
        </section>

        <!-- 写真一覧：小さい写真（thumb）を並べて、クリックすると大きい写真を表示する
             写真を増やすときは li を1行コピーして、2か所のファイル名を書きかえる -->
        <section class="gallery-section">
            <h2 class="gallery-heading">絶景ギャラリー<span class="photo-count" id="js-photo-count"></span></h2>
            <ul class="gallery" id="js-gallery">
                <li><a class="gallery-link" href="images/shiga/IMG_3886.jpg"><img src="images/shiga/thumb/IMG_3886.jpg" alt="雲の下に広がる雪山とゲレンデ" loading="lazy"></a></li>
                <li><a class="gallery-link" href="images/shiga/IMG_3887.jpg"><img src="images/shiga/thumb/IMG_3887.jpg" alt="青空と雪をかぶった木々のゲレンデ" loading="lazy"></a></li>
                <li><a class="gallery-link" href="images/shiga/IMG_3888.jpg"><img src="images/shiga/thumb/IMG_3888.jpg" alt="雪の積もった木々とリフト" loading="lazy"></a></li>
                <li><a class="gallery-link" href="images/shiga/IMG_3889.jpg"><img src="images/shiga/thumb/IMG_3889.jpg" alt="山並みを望むゲレンデを滑る人たち" loading="lazy"></a></li>
                <li><a class="gallery-link" href="images/shiga/IMG_3890.jpg"><img src="images/shiga/thumb/IMG_3890.jpg" alt="ゴンドラ乗り場から見た雪山" loading="lazy"></a></li>
                <li><a class="gallery-link" href="images/shiga/IMG_3891.jpg"><img src="images/shiga/thumb/IMG_3891.jpg" alt="雲のかかる山とゲレンデ" loading="lazy"></a></li>
                <li><a class="gallery-link" href="images/shiga/IMG_3892.jpg"><img src="images/shiga/thumb/IMG_3892.jpg" alt="青空と雪化粧した木々" loading="lazy"></a></li>
                <li><a class="gallery-link" href="images/shiga/IMG_3893.jpg"><img src="images/shiga/thumb/IMG_3893.jpg" alt="雪原に立つ白樺の林" loading="lazy"></a></li>
                <li><a class="gallery-link" href="images/shiga/IMG_3894.jpg"><img src="images/shiga/thumb/IMG_3894.jpg" alt="ゲレンデと山を背にしたスキーヤー" loading="lazy"></a></li>
                <li><a class="gallery-link" href="images/shiga/IMG_3895.jpg"><img src="images/shiga/thumb/IMG_3895.jpg" alt="リフトから見た青空とゲレンデ" loading="lazy"></a></li>
            </ul>
        </section>

        <p class="back-bottom"><a class="back-link" href="index.html">← 日本地図にもどる</a></p>
    </main>

    <footer class="site-footer">
        <small>&copy; 2026 スキー場絶景集</small>
    </footer>
